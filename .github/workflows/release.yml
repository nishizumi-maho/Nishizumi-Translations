name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v2.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/jp2subs/__init__.py').read_text()).group(1))")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION / package version: $PKG"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match jp2subs.__version__ ($PKG). Bump the package version first."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[gui,asr]"

      - name: Build application bundle
        run: python build_executable.py --mode onedir --clean

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not present on the runner; installing via Chocolatey."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\jp2subs.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          if (-not $setup) { throw "No installer was produced" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -FilePath "dist\installer\$($setup.Name).sha256" -Encoding ascii
          Write-Host "$($setup.Name): $hash ($([math]::Round($setup.Length/1MB,1)) MB)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*
          retention-days: 14

      - name: Publish to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $assets = (Get-ChildItem dist\installer\* | ForEach-Object { $_.FullName })
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $tag"
            gh release upload $tag $assets --clobber
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag $assets `
              --title "Nishizumi Translations ${{ steps.version.outputs.version }}" `
              --generate-notes
          }
