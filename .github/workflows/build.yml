name: Build Executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[gui,asr]"

      - name: Build executable
        run: python build_executable.py --mode onedir --clean

      - name: Verify the installer script compiles
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & "$iscc" "/DMyAppVersion=0.0.0-ci" installer\jp2subs.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nishizumi-translations-windows
          path: dist/installer/*.exe
          retention-days: 7

  build-linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[gui,asr]"

      - name: Build executable
        run: python build_executable.py --mode onedir --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nishizumi-translations-linux
          path: dist/NishizumiTranslations
          retention-days: 7
