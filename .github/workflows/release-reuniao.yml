name: Release Reuniões (experimental)

# Publishes the experimental meeting transcriber as a hidden pre-release: the
# GitHub release is created as a draft and marked as a pre-release, so it never
# shows up as "Latest" and nobody stumbles onto it from the releases page.
#
# Three ways in:
#   * push a tag such as reuniao-v0.1.0
#   * push a branch such as publicar/reuniao-v0.1.0, for when tag creation is
#     restricted: the tag is then cut here, from the version in the package.
#     Ending that branch name in -publico publishes the release instead of
#     leaving it hidden, which is the one way to get a download link that can
#     simply be clicked.
#   * run it by hand once this workflow reaches the default branch
#
# When the tag already exists it is that commit that gets built, whichever way
# the run started.
#
# The subtitle app has its own release.yml and is untouched by this one.

on:
  push:
    tags:
      - "reuniao-v*"
    branches:
      - "publicar/reuniao*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example reuniao-v0.1.0). Created when it does not exist yet."
        required: true
        type: string
      source:
        description: "Branch or commit the tag is cut from, when the tag does not exist yet."
        required: false
        default: "claude/whisper-audio-transcription-owuwfs"
        type: string
      draft:
        description: "Keep the release hidden as a draft."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  BUNDLE_NAME: NishizumiReunioes

jobs:
  resolve:
    name: Resolve tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag push builds that tag; a manual run starts from the branch, so
          # the tag can be cut here when it does not exist yet.
          ref: ${{ inputs.source || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the tag, and check it matches the package
        id: version
        run: |
          set -euo pipefail
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/reuniao/__init__.py').read_text()).group(1))")

          # A tag push names itself; a manual run is told the tag; a push to a
          # publication branch cuts the tag from the version in the package.
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="reuniao-v$PKG"
          fi
          VERSION="${TAG#reuniao-v}"

          echo "Tag version: $VERSION / package version: $PKG"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match reuniao.__version__ ($PKG). Bump the package version first."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; building the tagged commit."
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "refs/tags/$TAG"
            EXISTS=true
          else
            echo "$TAG does not exist yet; it will be cut from $(git rev-parse --short HEAD)."
            EXISTS=false
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only once the tree is known to carry the matching version, so a failed
      # check never leaves a tag behind.
      - name: Create the tag
        if: steps.version.outputs.exists != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Nishizumi Reunioes ${{ steps.version.outputs.version }} (experimental)"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

  windows:
    name: Windows installer
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[gui,asr,interlocutores]"

      - name: Build application bundle
        run: python build_reuniao.py --mode onedir --clean

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not present on the runner; installing via Chocolatey."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=${{ needs.resolve.outputs.version }}" installer\reuniao.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Checksum the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          if (-not $setup) { throw "No installer was produced" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -FilePath "dist\installer\$($setup.Name).sha256" -Encoding ascii
          Write-Host "$($setup.Name): $hash ($([math]::Round($setup.Length/1MB,1)) MB)"

      # The same bundle, with the portable marker in it and no installer at
      # all: for a machine without admin rights, where writing to Program
      # Files or AppData is what fails.
      - name: Package the portable build
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $stage = "dist\portatil"
          $folder = "$stage\NishizumiReunioes"
          New-Item -ItemType Directory -Force -Path $stage, "dist\release" | Out-Null
          Copy-Item -Recurse -Force "dist\NishizumiReunioes" $folder
          python -m reuniao.portable $folder
          if (-not (Test-Path "$folder\portatil.txt")) { throw "The portable marker was not written" }

          # Zipped from inside the staging folder on purpose: 7-Zip stores paths
          # relative to the working directory, not to the wildcard's parent, so
          # archiving "dist\portatil\*" from the repository root buries the
          # bundle under dist/portatil/ inside the zip.
          $zip = Join-Path (Get-Location).Path "dist\release\Nishizumi-Reunioes-$version-windows-portatil.zip"
          Push-Location $stage
          try {
            # 7-Zip ships with the runner and is far quicker than Compress-Archive
            # on a bundle this size, but the fallback keeps the build honest.
            if (Get-Command 7z -ErrorAction SilentlyContinue) {
              7z a -tzip -mx=5 $zip "NishizumiReunioes" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
            } else {
              Compress-Archive -Path "NishizumiReunioes" -DestinationPath $zip -CompressionLevel Optimal
            }
          } finally {
            Pop-Location
          }

          # What the user unzips has to be one folder with the marker beside the
          # executable. Checking it here is the only place it can be caught
          # before the file is published.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          foreach ($required in @("NishizumiReunioes/portatil.txt", "NishizumiReunioes/NishizumiReunioes.exe")) {
            if ($entries -notcontains $required) {
              throw "The portable zip is laid out wrong: $required is missing. Root entries: $(($entries | ForEach-Object { $_.Split('/')[0] } | Sort-Object -Unique) -join ', ')"
            }
          }
          Write-Host "Portable zip layout verified: $($entries.Count) entries under NishizumiReunioes/"

          $item = Get-Item $zip
          $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($item.Name)" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          Write-Host "$($item.Name): $hash ($([math]::Round($item.Length/1MB,1)) MB)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reunioes-windows
          path: |
            dist/installer/*
            dist/release/*
          retention-days: 14

  linux:
    name: Linux bundle
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[gui,asr,interlocutores]"

      - name: Build application bundle
        run: python build_reuniao.py --mode onedir --clean

      - name: Package and checksum
        run: |
          set -euo pipefail
          # A tarball you extract wherever you like is portable by nature, so
          # the marker ships in it: the models land beside the program rather
          # than in the home folder. Deleting portatil.txt restores the usual
          # per-user location.
          python -m reuniao.portable "dist/$BUNDLE_NAME"
          test -f "dist/$BUNDLE_NAME/portatil.txt"

          NAME="Nishizumi-Reunioes-${{ needs.resolve.outputs.version }}-linux-x64-portatil.tar.gz"
          mkdir -p dist/release
          tar -czf "dist/release/$NAME" -C dist "$BUNDLE_NAME"
          cd dist/release
          sha256sum "$NAME" > "$NAME.sha256"
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reunioes-linux
          path: dist/release/*
          retention-days: 14

  publish:
    name: Publish the hidden pre-release
    needs: [resolve, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the files
        id: files
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          ls -lh upload
          echo "count=$(ls upload | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Nishizumi Reuniões — versão experimental

          Transcrição de reuniões em **português do Brasil**: horários de fala,
          o que foi dito e, quando o pacote de vozes está instalado, quem falou
          cada trecho. A saída é um `.txt` em estilo legenda (opcionalmente
          também `.srt`, `.vtt` e `.json`).

          Tudo roda no seu computador — o áudio não sai da máquina.

          ### O que baixar

          | Sistema | Arquivo | Quando usar |
          | --- | --- | --- |
          | Windows | `...-windows-portatil.zip` | **Sem instalar nada.** Extraia numa pasta sua e abra `NishizumiReunioes.exe`. Modelos e preferências ficam dentro da própria pasta. É o que funciona em computador de trabalho, sem direito de administrador. |
          | Windows | `Nishizumi-Reunioes-Setup-<versão>.exe` | Instalação normal, por usuário. |
          | Linux | `...-linux-x64-portatil.tar.gz` | Extraia e rode `NishizumiReunioes`. |

          ### Primeiro uso

          1. Abra o aplicativo.
          2. Vá em **Componentes** e baixe o FFmpeg, um modelo de transcrição
             (o *Large v3 Turbo* é o recomendado) e a **Identificação de
             interlocutores**.
          3. Volte em **Transcrever**, arraste a gravação e clique em
             **Transcrever**.

          No pacote portátil tudo isso vai para a subpasta `dados`, ao lado do
          programa: a pasta inteira pode ser copiada para outro disco ou um pen
          drive. Apagar o arquivo `portatil.txt` devolve o comportamento normal.

          Na versão instalada, os modelos são compartilhados com o Nishizumi
          Translations: o que já estiver baixado é reaproveitado.

          ### Avisos

          - Build **experimental**, publicado como rascunho e pré-lançamento.
            Não é atualizado automaticamente e não substitui o Nishizumi
            Translations.
          - Sem GPU NVIDIA, uma reunião longa com o modelo grande pode levar
            horas. O *Large v3 Turbo* é bem mais rápido.
          - A identificação de interlocutores é automática: ela separa as vozes,
            mas não sabe os nomes. Preencha o campo **Nomes** para trocar
            "Interlocutor 1" pelo nome real.
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${{ needs.resolve.outputs.version }}"

          # Hidden by default: a draft release is visible only to people who can
          # write to the repository, and its files have no public URL at all —
          # which is also what makes it awkward to actually download. A
          # publication branch ending in -publico, or "draft: false" on a manual
          # run, publishes it instead. Either way it stays a pre-release, so it
          # never becomes the repository's "Latest".
          HIDDEN=true
          case "${{ github.ref_name }}" in
            *-publico) HIDDEN=false ;;
          esac
          case "${{ inputs.draft }}" in
            false) HIDDEN=false ;;
            true) HIDDEN=true ;;
          esac
          echo "Release $TAG: prerelease, draft=$HIDDEN"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating the existing release $TAG"
            gh release upload "$TAG" upload/* --clobber
            gh release edit "$TAG" --prerelease --draft="$HIDDEN" --notes-file notes.md \
              --title "Nishizumi Reuniões $VERSION (experimental)"
          else
            echo "Creating release $TAG"
            DRAFT_FLAG=""
            if [ "$HIDDEN" = "true" ]; then DRAFT_FLAG="--draft"; fi
            gh release create "$TAG" upload/* \
              --title "Nishizumi Reuniões $VERSION (experimental)" \
              --notes-file notes.md \
              --prerelease $DRAFT_FLAG
          fi
          gh release view "$TAG" --json name,isDraft,isPrerelease,assets \
            --jq '{name, isDraft, isPrerelease, assets: [.assets[].name]}'
