[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jp2subs"
dynamic = ["version"]
description = "Transcribe, romanize and subtitle Japanese audio/video, with self-installing models and tools."
authors = [{name = "Open Source Contributors"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12",
  "pykakasi>=2.2.1",
  "tqdm>=4.66",
  "rich>=13.7",
  "python-dateutil>=2.8",
]
[project.optional-dependencies]
llm = ["requests>=2.31"]
asr = ["faster-whisper>=1.0"]
gui = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/nishizumi-maho/Nishizumi-Translations"
Issues = "https://github.com/nishizumi-maho/Nishizumi-Translations/issues"

[project.scripts]
jp2subs = "jp2subs.cli:main"
jp2subs-gui = "jp2subs.gui.main:launch"

[tool.setuptools.dynamic]
version = {attr = "jp2subs.__version__"}

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
